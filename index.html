<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#070b13" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Oxygen Flow — by Shaurya Mittal</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070b13;
      --surface: rgba(17, 24, 37, .82);
      --surface-solid: #111827;
      --surface-2: rgba(34, 44, 63, .78);
      --line: rgba(255, 255, 255, .1);
      --text: #f6f8fc;
      --muted: #aab4c6;
      --dim: #667287;
      --accent: #9bd4ff;
      --accent-2: #5eb6fa;
      --on-accent: #07111a;
      --danger: #ff8d9b;
      --green: #8ce7bd;
      --yellow: #ffd68a;
      --shadow: 0 28px 80px rgba(0, 0, 0, .38);
      --radius: 28px;
      --wallpaper: radial-gradient(ellipse at 12% 4%, rgba(56, 118, 176, .32), transparent 34%),
        radial-gradient(ellipse at 88% 12%, rgba(131, 59, 180, .28), transparent 30%),
        radial-gradient(ellipse at 40% 74%, rgba(22, 79, 133, .24), transparent 36%),
        linear-gradient(145deg, #0b1422 0%, #0b1020 42%, #16102b 100%);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; min-height: 100%; background: #02040a; color: var(--text); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overflow: hidden; }
    button, input { font: inherit; }
    button { color: inherit; border: 0; cursor: pointer; }
    .phone {
      position: relative; width: min(100vw, 440px); height: 100svh; min-height: 610px; overflow: hidden; margin: auto;
      background: var(--wallpaper); background-size: 180% 180%; background-position: 50% 50%;
      transition: background .7s ease, filter .5s ease; isolation: isolate;
    }
    .phone::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(0,0,0,.18), transparent 25%, rgba(0,0,0,.22)); pointer-events: none; }
    @media (min-width: 600px) {
      body { display: grid; place-items: center; padding: 22px; }
      .phone { height: min(900px, calc(100svh - 44px)); border-radius: 38px; box-shadow: 0 0 0 1px rgba(255,255,255,.12), 0 40px 100px rgba(0,0,0,.7); }
      .phone::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); pointer-events: none; }
    }
    .screen { position: absolute; inset: 0; overflow: hidden; }
    .status {
      height: 44px; display: flex; align-items: center; justify-content: space-between; padding: max(7px, env(safe-area-inset-top)) 21px 0;
      position: relative; z-index: 4; font-size: 12px; font-weight: 700; letter-spacing: .01em;
    }
    .status-time { font-size: 13px; letter-spacing: -.02em; }
    .status-right { display: flex; align-items: center; gap: 8px; color: rgba(255,255,255,.93); }
    .status-right svg { width: 15px; height: 15px; fill: currentColor; stroke: currentColor; }
    .battery { display: flex; align-items: center; gap: 4px; }
    .battery-shell { width: 20px; height: 10px; border: 1.5px solid currentColor; border-radius: 3px; padding: 1.5px; }
    .battery-level { height: 100%; width: 76%; border-radius: 1px; background: currentColor; }
    .battery-cap { width: 2px; height: 4px; background: currentColor; border-radius: 0 2px 2px 0; }
    .home {
      height: calc(100% - 44px); padding: 40px 22px max(20px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; position: relative;
    }
    .greeting { font-size: 13px; font-weight: 650; color: rgba(255,255,255,.63); letter-spacing: .03em; margin-top: 2px; }
    .clock { font-size: clamp(64px, 19vw, 82px); letter-spacing: -.085em; line-height: .92; font-weight: 260; margin: 7px 0 8px -4px; text-shadow: 0 6px 30px rgba(0,0,0,.24); }
    .date { color: rgba(255,255,255,.77); font-weight: 550; font-size: 13px; letter-spacing: .01em; }
    .at-a-glance { margin-top: 30px; display: flex; align-items: center; gap: 9px; color: rgba(255,255,255,.7); font-size: 12px; }
    .glance-pill { display: inline-flex; align-items: center; gap: 6px; padding: 7px 11px; border: 1px solid rgba(255,255,255,.12); border-radius: 999px; background: rgba(8,14,24,.3); backdrop-filter: blur(12px); }
    .weather-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--yellow); box-shadow: 0 0 12px var(--yellow); }
    .app-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px 13px; margin-top: auto; padding: 22px 1px 22px; }
    .app { display: flex; flex-direction: column; align-items: center; gap: 7px; background: transparent; min-width: 0; }
    .app-label { font-size: 11px; font-weight: 550; color: rgba(255,255,255,.92); max-width: 76px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .icon {
      width: 54px; height: 54px; border-radius: 18px; display: grid; place-items: center; position: relative;
      box-shadow: 0 11px 24px rgba(0,0,0,.22), inset 0 1px rgba(255,255,255,.25); transition: transform .16s ease, filter .16s ease;
    }
    .app:active .icon, .dock-app:active .icon, .quick-tile:active { transform: scale(.89); filter: brightness(1.2); }
    .icon svg { width: 27px; height: 27px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .icon.camera { background: linear-gradient(145deg,#344563,#152237); color: #e1edff; }
    .icon.gallery { background: linear-gradient(145deg,#ffae70,#dd577d 54%,#6a4bb5); color: #fff; }
    .icon.settings { background: linear-gradient(145deg,#727f94,#303b4e); color: #fff; }
    .icon.files { background: linear-gradient(145deg,#69c1ff,#3b6fe5); color: #fff; }
    .icon.notes { background: linear-gradient(145deg,#ffe68c,#e79a31); color: #32200c; }
    .icon.calculator { background: linear-gradient(145deg,#9a91ff,#6056c9); color: #fff; }
    .icon.phone { background: linear-gradient(145deg,#67e4ad,#249b83); color: #041c18; }
    .icon.clock { background: linear-gradient(145deg,#b3c9dc,#60798d); color: #08121a; }
    .icon.music { background: linear-gradient(145deg,#f596be,#9a54bc); color: #fff; }
    .icon.chrome { background: conic-gradient(#f3cc43 0 33%, #5bbb72 0 66%, #e46c69 0); color: #253351; }
    .icon.messages { background: linear-gradient(145deg,#76c9ff,#397ce4); color: #fff; }
    .icon.contacts { background: linear-gradient(145deg,#ffb26b,#f16f7a); color: #fff; }
    .icon.video { background: linear-gradient(145deg,#ff8b9d,#b84d83); color: #fff; }
    .icon.edit { background: linear-gradient(145deg,#a7e58a,#4c9c78); color: #0b211b; }
    .dock { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 12px 8px; border: 1px solid rgba(255,255,255,.11); border-radius: 26px; background: rgba(10,16,28,.34); backdrop-filter: blur(22px); }
    .dock-app { display: flex; justify-content: center; background: none; }
    .dock .icon { width: 54px; height: 54px; border-radius: 18px; }
    .gesture { width: 105px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.8); margin: 15px auto 0; cursor: grab; }
    .gesture-hint { position: absolute; top: 4px; left: 50%; transform: translateX(-50%); width: 55px; height: 3px; border-radius: 9px; background: rgba(255,255,255,.23); }
    .shade {
      position: absolute; inset: 0; z-index: 20; padding: 43px 18px 25px; overflow-y: auto;
      background: rgba(8, 14, 25, .91); backdrop-filter: blur(34px) saturate(130%); transform: translateY(-104%); transition: transform .38s cubic-bezier(.2,.9,.25,1); overscroll-behavior: contain;
    }
    .shade.open { transform: translateY(0); }
    .shade-header { display: flex; align-items: flex-start; justify-content: space-between; margin: 0 3px 25px; }
    .shade-time { font-size: 50px; letter-spacing: -.07em; line-height: .9; font-weight: 250; }
    .shade-day { margin-top: 10px; font-size: 13px; color: var(--muted); }
    .shade-head-actions { display: flex; gap: 8px; }
    .round-button { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.1); border: 1px solid var(--line); }
    .round-button svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; }
    .tiles { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; }
    .quick-tile { min-height: 72px; padding: 13px 14px; display: flex; align-items: center; gap: 11px; text-align: left; border-radius: 21px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.09); transition: all .18s ease; }
    .quick-tile.active { background: var(--accent); color: var(--on-accent); border-color: transparent; }
    .quick-tile.active .tile-meta { color: rgba(7,17,26,.65); }
    .tile-icon { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; background: rgba(255,255,255,.1); flex: none; }
    .quick-tile.active .tile-icon { background: rgba(7,17,26,.12); }
    .tile-icon svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .tile-name { display: block; font-size: 12px; font-weight: 750; }
    .tile-meta { display: block; color: var(--muted); font-size: 10px; margin-top: 3px; }
    .shade-media { display: flex; align-items: center; gap: 12px; margin-top: 12px; padding: 13px; border-radius: 21px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.1); }
    .shade-media-art { width: 43px; height: 43px; border-radius: 14px; display: grid; place-items: center; background: linear-gradient(145deg,#f596be,#9a54bc); }
    .shade-media-art svg { width: 22px; height: 22px; stroke: #fff; fill: none; stroke-width: 1.6; }
    .shade-media-copy { flex: 1; min-width: 0; }
    .shade-media-copy strong, .shade-media-copy span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .shade-media-copy strong { font-size: 12px; } .shade-media-copy span { color: var(--muted); font-size: 10px; margin-top: 3px; }
    .shade-media-action { width: 32px; height: 32px; display: grid; place-items: center; background: rgba(255,255,255,.1); border-radius: 50%; }
    .shade-media-action svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; }
    .slider-card { margin-top: 12px; padding: 14px 16px; border-radius: 20px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.09); }
    .slider-row { display: flex; align-items: center; gap: 12px; }
    .slider-row + .slider-row { margin-top: 14px; }
    .slider-row svg { width: 17px; height: 17px; stroke: var(--muted); fill: none; stroke-width: 1.8; }
    input[type="range"] { appearance: none; height: 5px; border-radius: 999px; flex: 1; background: linear-gradient(90deg, var(--accent) 0 74%, rgba(255,255,255,.14) 74%); outline: none; }
    input[type="range"]::-webkit-slider-thumb { appearance: none; width: 19px; height: 19px; border-radius: 50%; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.35); }
    .notif-title { display: flex; justify-content: space-between; align-items: center; margin: 25px 2px 10px; font-size: 12px; color: var(--muted); font-weight: 750; text-transform: uppercase; letter-spacing: .12em; }
    .clear-button { font-size: 10px; letter-spacing: normal; text-transform: none; color: var(--accent); background: none; }
    .notification { display: flex; gap: 12px; padding: 14px; margin-bottom: 9px; border-radius: 19px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.08); }
    .notif-icon { width: 31px; height: 31px; border-radius: 10px; display: grid; place-items: center; background: #6c5ce7; flex: none; }
    .notif-icon svg { width: 17px; height: 17px; stroke: #fff; fill: none; stroke-width: 2; }
    .notification strong { display: block; font-size: 12px; }
    .notification p { margin: 4px 0 0; color: var(--muted); font-size: 11px; line-height: 1.4; }
    .notification time { margin-left: auto; color: var(--dim); font-size: 10px; }
    .empty-state { text-align: center; color: var(--muted); font-size: 12px; padding: 25px 0; }
    .drawer {
      position: absolute; inset: 0; z-index: 15; padding: 50px 18px 26px; background: rgba(6, 10, 18, .87); backdrop-filter: blur(34px);
      transform: translateY(103%); transition: transform .38s cubic-bezier(.2,.9,.25,1); overflow-y: auto;
    }
    .drawer.open { transform: translateY(0); }
    .drawer-grab { width: 38px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.27); margin: -29px auto 24px; }
    .drawer-heading { display: flex; align-items: center; justify-content: space-between; }
    .drawer-heading h2 { font-size: 25px; font-weight: 480; letter-spacing: -.04em; margin: 0; }
    .search { display: flex; align-items: center; gap: 10px; padding: 14px 15px; background: rgba(255,255,255,.09); border-radius: 17px; margin: 18px 0 24px; }
    .search svg { width: 18px; height: 18px; stroke: var(--muted); fill: none; stroke-width: 2; }
    .search input { background: none; border: 0; outline: none; color: var(--text); width: 100%; font-size: 14px; }
    .search input::placeholder { color: var(--muted); }
    .drawer-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 21px 10px; }
    .drawer .app-label { color: var(--text); text-align: center; }
    .drawer .icon { width: 54px; height: 54px; }
    .drawer-section { margin: 23px 0 12px; font-size: 11px; text-transform: uppercase; color: var(--dim); letter-spacing: .12em; font-weight: 750; }
    .modal { position: absolute; inset: 0; z-index: 30; display: flex; align-items: flex-end; background: rgba(0,0,0,.5); opacity: 0; pointer-events: none; transition: opacity .22s ease; }
    .modal.visible { opacity: 1; pointer-events: auto; }
    .sheet { width: 100%; max-height: 92%; overflow-y: auto; background: #111827; border: 1px solid rgba(255,255,255,.12); border-bottom: 0; border-radius: 30px 30px 0 0; padding: 11px 20px max(25px, env(safe-area-inset-bottom)); transform: translateY(30px); transition: transform .28s ease; }
    .modal.visible .sheet { transform: translateY(0); }
    .modal.full-screen-sheet { align-items: stretch; background: #eef0f3; }
    .modal.full-screen-sheet .sheet { max-height: none; height: 100%; border: 0; border-radius: 0; padding: max(12px, env(safe-area-inset-top)) 20px max(25px, env(safe-area-inset-bottom)); background: #eef0f3; color: #101216; transform: translateY(0); }
    .settings-screen { min-height: 100%; color: #101216; }
    .settings-screen .sheet-handle { background: #c4c8cd; margin-bottom: 18px; }
    .settings-toolbar { display: flex; align-items: center; gap: 12px; padding: 7px 0 18px; }
    .settings-toolbar h2 { margin: 0; font-size: 30px; letter-spacing: -.06em; font-weight: 760; }
    .settings-toolbar .close { margin-left: auto; background: #e1e4e8; color: #41454b; }
    .settings-search { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-radius: 20px; background: #e0e2e6; color: #555c65; margin-bottom: 14px; }
    .settings-search svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 2; }
    .settings-search input { width: 100%; border: 0; background: transparent; outline: 0; color: #17191d; font-size: 17px; }
    .settings-search input::placeholder { color: #6a7078; }
    .profile-card { display: flex; align-items: center; gap: 12px; padding: 16px; border-radius: 25px; background: #fff; margin-bottom: 14px; box-shadow: 0 3px 13px rgba(50,55,65,.05); }
    .profile-avatar { width: 43px; height: 43px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(145deg,#8fbd77,#5277b4); color: #fff; font-weight: 800; }
    .profile-card strong { display: block; font-size: 15px; }
    .profile-card span { display: block; color: #8a9098; font-size: 12px; margin-top: 4px; }
    .settings-group { overflow: hidden; background: #fff; border-radius: 22px; margin: 12px 0; box-shadow: 0 3px 13px rgba(50,55,65,.035); }
    .settings-group-title { color: #8a9098; font-size: 11px; text-transform: uppercase; font-weight: 800; letter-spacing: .1em; margin: 18px 4px 8px; }
    .settings-screen .setting-row { min-height: 67px; padding: 12px 14px; color: #111; border-bottom: 1px solid #eceef0; background: #fff; text-align: left; }
    .settings-screen .setting-row:last-child { border-bottom: 0; }
    .settings-screen .setting-symbol { color: #45c9b5; background: transparent; width: 30px; height: 30px; }
    .settings-screen .setting-copy strong { font-size: 16px; font-weight: 580; }
    .settings-screen .setting-copy span { color: #858b92; font-size: 12px; }
    .settings-screen .setting-row > svg { width: 18px; height: 18px; stroke: #afb4ba; fill: none; stroke-width: 1.6; }
    .settings-screen .sheet-title { display: none; }
    .settings-screen .close { color: #34383d; }
    .settings-screen .switch { background: #d3d6da; }
    .settings-screen .switch.on { background: #45c9b5; }
    .about-hero { border-radius: 23px; padding: 32px 20px 27px; min-height: 240px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: white; background: radial-gradient(circle at 85% 5%,rgba(255,255,255,.55),transparent 22%), radial-gradient(circle at 10% 82%,rgba(255,91,65,.85),transparent 34%), linear-gradient(145deg,#20133d,#5e1b4d 42%,#67bde6 92%); overflow: hidden; position: relative; }
    .about-hero::after { content: ""; position: absolute; width: 250px; height: 250px; border: 1px solid rgba(255,255,255,.33); border-radius: 50%; right: -68px; top: 5px; box-shadow: 0 0 0 30px rgba(255,255,255,.05), 0 0 0 62px rgba(255,255,255,.035); }
    .about-hero small { font-size: 12px; letter-spacing: .06em; position: relative; z-index: 1; }
    .about-hero strong { font-size: 38px; letter-spacing: -.08em; margin: 14px 0 5px; position: relative; z-index: 1; }
    .about-hero span { position: relative; z-index: 1; font-size: 16px; opacity: .9; }
    .device-cards { display: grid; grid-template-columns: repeat(2,1fr); gap: 12px; margin: 13px 0; }
    .device-card { padding: 18px 14px; border-radius: 21px; background: #fff; min-height: 126px; }
    .device-card svg { width: 18px; height: 18px; color: #47c6b0; stroke: currentColor; fill: none; stroke-width: 1.8; }
    .device-card small { display: block; color: #858b92; font-size: 12px; margin-top: 13px; }
    .device-card strong { display: block; font-size: 18px; margin-top: 5px; line-height: 1.2; }
    .info-card { background: #fff; border-radius: 21px; overflow: hidden; }
    .info-line { display: flex; justify-content: space-between; gap: 15px; padding: 15px 17px; border-bottom: 1px solid #eceef0; font-size: 14px; }
    .info-line:last-child { border-bottom: 0; }
    .info-line span:last-child { color: #858b92; text-align: right; }
    .compass-screen { min-height: 100%; background: #f1f3f5; color: #222; text-align: center; }
    .compass-toolbar { display: flex; align-items: center; justify-content: space-between; padding: 8px 0 18px; }
    .compass-toolbar h2 { font-size: 22px; margin: 0; }
    .compass-readout { font-size: 40px; font-weight: 740; letter-spacing: -.06em; padding-top: 9px; }
    .compass-dial { width: min(82vw, 320px); aspect-ratio: 1; margin: 36px auto 28px; border-radius: 50%; position: relative; display: grid; place-items: center; background: repeating-conic-gradient(from 0deg,#b4bac1 0 1deg,transparent 1deg 6deg), radial-gradient(circle,#f9fafb 0 62%,#e2e5e8 63% 64%,#fafbfc 65% 100%); border: 7px solid #f9fafb; box-shadow: 0 8px 22px rgba(99,104,111,.18), inset 0 0 0 1px #c9cdd1; transition: transform .6s cubic-bezier(.2,.8,.2,1); }
    .compass-dial::before { content: ""; position: absolute; width: 2px; height: 74%; background: linear-gradient(#ef5b3f 0 48%,#77808a 48%); }
    .compass-dial::after { content: ""; position: absolute; width: 58%; height: 2px; background: #808891; }
    .compass-letter { position: absolute; font-size: 20px; color: #66717a; font-weight: 560; }
    .compass-letter.n { top: 42px; color: #ed5b3f; } .compass-letter.e { right: 42px; } .compass-letter.s { bottom: 42px; } .compass-letter.w { left: 42px; }
    .compass-center { z-index: 1; width: 44px; height: 44px; border-radius: 50%; border: 1px solid #747d86; background: rgba(255,255,255,.55); }
    .tool-data { background: #fff; border-radius: 20px; overflow: hidden; text-align: left; }
    .tool-data .info-line { font-size: 15px; padding: 14px 17px; }
    .phone.settings-open .status { color: #202328; }
    .phone.settings-open .status-right { color: #202328; }
    .phone.settings-open .battery-shell { border-color: #202328; }
    .settings-section-spacer { height: 6px; }
    .sheet-handle { width: 38px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.22); margin: 0 auto 22px; }
    .sheet-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
    .sheet-title h2 { font-weight: 520; font-size: 23px; letter-spacing: -.04em; margin: 0; }
    .close { width: 33px; height: 33px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.1); }
    .close svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }
    .settings-list { display: grid; gap: 3px; }
    .setting-row { display: flex; align-items: center; gap: 13px; padding: 14px 7px; border-bottom: 1px solid rgba(255,255,255,.07); }
    .setting-row:last-child { border: 0; }
    .setting-symbol { width: 35px; height: 35px; display: grid; place-items: center; border-radius: 12px; background: rgba(155,212,255,.13); color: var(--accent); }
    .setting-symbol svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .setting-copy { flex: 1; }
    .setting-copy strong { font-size: 13px; font-weight: 650; display: block; }
    .setting-copy span { color: var(--muted); font-size: 11px; display: block; margin-top: 3px; }
    .switch { width: 41px; height: 24px; padding: 3px; border-radius: 20px; background: rgba(255,255,255,.15); transition: background .2s; }
    .switch::after { content: ""; display: block; width: 18px; height: 18px; border-radius: 50%; background: #c5ccd8; transition: transform .2s, background .2s; }

      function simpleView(title, id, subtitle, body) { openModal(`<div class="sheet-handle"></div><div class="sheet-title"><h2>${title}</h2><button class="close" data-close>${icon("back")}</button></div><div style="padding:18px 10px;text-align:center"><div class="setting-symbol" style="margin:auto;width:60px;height:60px;border-radius:20px">${icon(id)}</div><h3 style="margin:16px 0 5px">${subtitle}</h3><p style="color:var(--muted);font-size:12px;line-height:1.6;margin:0">${body}</p></div>`); }
      async function openApp(action) {
        setOpen("");
        playTone(610, .045);
        if (action === "settings") settingsView();
        else if (action === "camera") await cameraView();
        else if (action === "gallery") galleryView();
        else if (action === "files") filesView();
        else if (action === "notes") notesView();
        else if (action === "calculator") calculatorView();
        else if (action === "music" || action === "audio") audioView();
        else if (action === "video") videoView();
        else if (action === "editor") editorView();
         else if (action === "compass") compassView();
        else if (action === "browser") { try { window.open("https://www.google.com","_blank","noopener"); toast("Opening browser"); } catch (_) { toast("Browser blocked this tab"); } }
        else if (action === "messages") simpleView("Messages","messages","No unread messages","Your conversations will appear here. This web shell never sends a message without your action.");
        else if (action === "contacts") simpleView("Contacts","contacts","Your contacts","Contacts stay on your device. Use your browser's permission prompt when a real app needs access.");
        else if (action === "phone") simpleView("Phone","phone","Dialer ready","Web browsers cannot place calls by themselves. Add a tel: link from a real phone to start a call.");
        else if (action === "clock") simpleView("Clock","clock","09:41","Alarm, timer and stopwatch modules are ready for your next build.");
      }
      let calc = "0", calcFresh = true;
      function calcInput(key) {
        const display = $("calcDisplay"); if (!display) return;
        if (key === "C") calc = "0";
        else if (key === "⌫") calc = calc.length > 1 ? calc.slice(0,-1) : "0";
        else if (key === "=") { try { const expr = calc.replaceAll("×","*").replaceAll("÷","/").replaceAll("−","-").replace(/%/g,"/100"); calc = String(Function("return " + expr)()); } catch (_) { calc = "Error"; } calcFresh = true; }
        else if (key === "±") calc = calc.startsWith("-") ? calc.slice(1) : "-" + calc;
        else { if (calcFresh || calc === "0" || calc === "Error") { calc = ""; calcFresh = false; } if (key === "." && calc.endsWith(".")) return; calc += key; }
        display.textContent = calc; playTone(key === "=" ? 740 : 520, .025);
      }
      phone.addEventListener("click", async (e) => {
        const app = e.target.closest("[data-action]"); if (app) return openApp(app.dataset.action);
        const quick = e.target.closest("[data-quick]"); if (quick) { const id = quick.dataset.quick; state.quick[id] = !state.quick[id]; renderTiles(); playTone(state.quick[id] ? 700 : 390); vibrate(); if (id === "dnd") $("focusPill").textContent = state.quick[id] ? "Do not disturb" : "Focus ready"; toast(`${quick.querySelector(".tile-name").textContent} ${state.quick[id] ? "on" : "off"}`); return; }
         if (e.target.closest("#shadeSettings")) return settingsView();
         if (e.target.closest("[data-shade-media]")) { setOpen(""); return audioView(); }
        if (e.target.closest("#powerButton")) return toast("Power menu is browser-safe: close this tab to exit");
        if (e.target.closest("#clearNotifs")) { state.notifications = []; localStorage.setItem("oxygen-notifs","[]"); renderNotifications(); toast("Notifications cleared"); return; }
        if (e.target.closest("#drawerClose")) return setOpen("drawer", false);
        if (e.target.closest("#scrim")) return setOpen("");
        if (e.target.closest("[data-close]")) return closeModal();
         if (e.target.closest("[data-settings-back]")) return settingsView();
         if (e.target.closest("[data-developer-options]")) return developerView();
         if (e.target.closest("[data-update-check]")) return toast("System is up to date · browser edition");
         if (e.target.closest("[data-diagnostics]")) return toast("Diagnostics passed · browser APIs ready where permitted");
         if (e.target.closest("[data-compass-calibrate]")) return toast("Hold the device flat to calibrate the browser sensor");
        const page = e.target.closest("[data-settings-page]"); if (page) return openSettingsPage(page.dataset.settingsPage);
        const settingAction = e.target.closest("[data-setting-action]"); if (settingAction) {
          const action = settingAction.dataset.settingAction;
          if (action === "wallpaperOpen") return wallpaperView();
          if (action === "permissionInfo") return toast("Permissions are handled by your browser");
          if (action === "wifiToggle" || action === "bluetoothToggle" || action === "airplaneToggle") { state.quick[action.replace("Toggle","")] = !state.quick[action.replace("Toggle","")]; renderTiles(); openSettingsPage("network"); return; }
          return settingAction.querySelector(".switch")?.classList.toggle("on");
        }
        const wp = e.target.closest("[data-wallpaper]"); if (wp) { state.wallpaper = wp.dataset.wallpaper; localStorage.setItem("oxygen-wallpaper", state.wallpaper); applyWallpaper(); wallpaperView(); toast("Wallpaper applied"); return; }
        const imagePicker = e.target.closest("[data-gallery-upload], [data-editor-upload], [data-camera-upload]");
        if (imagePicker) { imagePickerMode = imagePicker.matches("[data-editor-upload]") ? "editor" : "gallery"; $("imageInput").click(); return; }
        if (e.target.closest("[data-wallpaper-upload]")) { $("wallpaperInput").click(); return; }
        if (e.target.closest("[data-video-upload]")) { $("videoInput").click(); return; }
        if (e.target.closest("[data-audio-upload]")) { $("audioInput").click(); return; }
        const imageZoom = e.target.closest("#imageZoom");
        if (imageZoom) { galleryZoom = Number(imageZoom.value); updateImageEditor(); return; }
        const imageFilter = e.target.closest("[data-image-filter]");
        if (imageFilter) { galleryFilter = imageFilter.dataset.imageFilter; updateImageEditor(); return; }
        if (e.target.closest("[data-image-rotate]")) { galleryRotation = (galleryRotation + 90) % 360; updateImageEditor(); return; }
        if (e.target.closest("[data-download-image]")) {
          const img = $("galleryImage"); if (!img) return;
          const canvas = document.createElement("canvas"); canvas.width = img.naturalWidth || 900; canvas.height = img.naturalHeight || 900; const ctx = canvas.getContext("2d"); ctx.filter = { none:"none", mono:"grayscale(1) contrast(1.08)", glow:"saturate(1.55) brightness(1.08) hue-rotate(12deg)", cool:"saturate(.85) hue-rotate(165deg)" }[galleryFilter] || "none"; ctx.translate(canvas.width/2,canvas.height/2); ctx.rotate(galleryRotation*Math.PI/180); ctx.scale(galleryZoom,galleryZoom); ctx.drawImage(img,-canvas.width/2,-canvas.height/2,canvas.width,canvas.height); const link = document.createElement("a"); link.download = "oxygen-flow-edit.jpg"; link.href = canvas.toDataURL("image/jpeg",.92); link.click(); toast("Edited photo saved"); return;
        }
        const captureMode = e.target.closest("[data-capture-mode]");
        if (captureMode) {
          state.cameraMode = captureMode.dataset.captureMode;
          document.querySelectorAll(".camera-mode").forEach(el => el.classList.toggle("active", el === captureMode));
          const shutter = document.querySelector("[data-shutter]");
          if (shutter) shutter.classList.remove("recording");
          if (cameraRecorder && cameraRecorder.state !== "inactive") { cameraRecorder.onstop = null; cameraRecorder.stop(); cameraRecorder = null; }
          $("cameraTip").textContent = state.cameraMode === "video" ? "Video mode · tap to record" : state.cameraMode === "portrait" ? "Portrait mode · depth preview" : "Photo mode · tap the shutter";
          playTone(650); return;
        }
        const zoomButton = e.target.closest("[data-zoom]");
        if (zoomButton) { state.cameraZoom = Number(zoomButton.dataset.zoom); updateCameraPreview(); playTone(580); return; }
        const filterButton = e.target.closest("[data-filter]");
        if (filterButton) { state.cameraFilter = filterButton.dataset.filter; updateCameraPreview(); playTone(610); return; }
        if (e.target.closest("[data-file-picker]")) { $("fileInput").click(); return; }
        if (e.target.closest("[data-save-note]")) { state.note = $("noteArea")?.value || ""; localStorage.setItem("oxygen-note",state.note); toast("Note saved locally"); return; }
        const calcKey = e.target.closest("[data-calc]"); if (calcKey) return calcInput(calcKey.dataset.calc);
        if (e.target.closest("[data-camera-flip]")) {
          cameraFacing = cameraFacing === "environment" ? "user" : "environment";
          const video = $("cameraVideo"); const oldStream = video?.srcObject;
          if (oldStream) oldStream.getTracks().forEach(t => t.stop());
          if (video && navigator.mediaDevices?.getUserMedia) {
            try { video.srcObject = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:cameraFacing }, audio:false }); $("cameraTip").textContent = cameraFacing === "user" ? "Front camera · tap the shutter" : "Rear camera · tap the shutter"; updateCameraPreview(); } catch (_) { toast("Camera switch unavailable"); }
          }
          return;
        }
        if (e.target.closest("[data-shutter]")) {
          const video = $("cameraVideo"); if (!video || !video.videoWidth) return toast("Camera preview is not available");
          const shutter = e.target.closest("[data-shutter]");
          if (state.cameraMode === "video") {
            if (cameraRecorder && cameraRecorder.state === "recording") { cameraRecorder.stop(); return; }
            if (!window.MediaRecorder || !video.srcObject) return toast("Video recording is not supported here");
            cameraChunks = [];
            try {
              cameraRecorder = new MediaRecorder(video.srcObject);
              cameraRecorder.ondataavailable = ev => { if (ev.data.size) cameraChunks.push(ev.data); };
              cameraRecorder.onstop = () => { const stream = video.srcObject; if (stream) stream.getTracks().forEach(t => t.stop()); const url = URL.createObjectURL(new Blob(cameraChunks, { type:"video/webm" })); cameraRecorder = null; videoView(url, true); };
              cameraRecorder.start(); shutter.classList.add("recording"); $("cameraTip").textContent = "Recording video · tap to stop"; playTone(420);
            } catch (_) { toast("Video recording is unavailable"); }
            return;
          }
          const canvas = document.createElement("canvas"); canvas.width = video.videoWidth; canvas.height = video.videoHeight; const ctx = canvas.getContext("2d");
          ctx.filter = { none:"none", mono:"grayscale(1) contrast(1.08)", glow:"saturate(1.55) brightness(1.08) hue-rotate(12deg)", cool:"saturate(.85) hue-rotate(165deg)" }[state.cameraFilter] || "none"; ctx.drawImage(video,0,0); galleryView(canvas.toDataURL("image/jpeg",.9)); toast("Photo captured");
        }
      });
      $("appSearch").addEventListener("input", e => renderApps(e.target.value));
      $("brightness").addEventListener("input", e => { state.brightness = +e.target.value; e.target.style.background = `linear-gradient(90deg,var(--accent) 0 ${state.brightness}%,rgba(255,255,255,.14) ${state.brightness}%)`; phone.style.filter = `brightness(${.72 + state.brightness / 250})`; });
      $("volume").addEventListener("input", e => { state.volume = +e.target.value; e.target.style.background = `linear-gradient(90deg,var(--accent) 0 ${state.volume}%,rgba(255,255,255,.14) ${state.volume}%)`; });
      modal.addEventListener("input", e => { if (e.target.matches("[data-volume]")) { state.volume = +e.target.value; } if (e.target.matches("[data-brightness]")) { state.brightness = +e.target.value; phone.style.filter = `brightness(${.72 + state.brightness / 250})`; } if (e.target.matches("#imageZoom")) { galleryZoom = Number(e.target.value); updateImageEditor(); } if (e.target.matches("#settingsSearch")) { const query = e.target.value.toLowerCase(); modal.querySelectorAll(".settings-group .setting-row").forEach(row => row.style.display = row.textContent.toLowerCase().includes(query) ? "flex" : "none"); } });
      $("imageInput").addEventListener("change", e => { const file = e.target.files?.[0]; if (!file) return; const reader = new FileReader(); reader.onload = () => imagePickerMode === "editor" ? editorView(reader.result) : galleryView(reader.result); reader.readAsDataURL(file); e.target.value = ""; });
      $("wallpaperInput").addEventListener("change", e => { const file = e.target.files?.[0]; if (!file) return; const reader = new FileReader(); reader.onload = () => { state.wallpaperCustom = reader.result; state.wallpaper = "custom"; try { localStorage.setItem("oxygen-wallpaper-custom", state.wallpaperCustom); localStorage.setItem("oxygen-wallpaper", "custom"); } catch (_) { toast("Wallpaper applied for this session"); } applyWallpaper(); wallpaperView(); toast("Device wallpaper applied"); }; reader.readAsDataURL(file); e.target.value = ""; });
      $("fileInput").addEventListener("change", e => { const list = [...(e.target.files || [])]; const el = $("fileList"); if (el) el.innerHTML = list.length ? list.map(f => `<div class="notification"><span class="notif-icon">${icon("files")}</span><div><strong>${escapeHtml(f.name)}</strong><p>${Math.round(f.size / 1024)} KB · selected from device</p></div></div>`).join("") : ""; e.target.value = ""; });
      $("videoInput").addEventListener("change", e => { const file = e.target.files?.[0]; if (!file) return; videoView(URL.createObjectURL(file), false); e.target.value = ""; });
      $("audioInput").addEventListener("change", e => { const file = e.target.files?.[0]; if (!file) return; audioView(URL.createObjectURL(file), file.name); e.target.value = ""; });
      function applyWallpaper() {
        const backgrounds = {
          ink:"radial-gradient(ellipse at 12% 4%,rgba(56,118,176,.32),transparent 34%),radial-gradient(ellipse at 88% 12%,rgba(131,59,180,.28),transparent 30%),radial-gradient(ellipse at 40% 74%,rgba(22,79,133,.24),transparent 36%),linear-gradient(145deg,#0b1422 0%,#0b1020 42%,#16102b 100%)",
          aurora:"radial-gradient(circle at 75% 15%,rgba(179,93,225,.7),transparent 30%),radial-gradient(circle at 10% 70%,rgba(76,183,204,.55),transparent 37%),linear-gradient(145deg,#15223c,#080d1b)",
          sunset:"radial-gradient(circle at 70% 34%,rgba(255,189,115,.8),transparent 12%),linear-gradient(150deg,#2c1638,#eb667f 56%,#151e4d)",
          forest:"radial-gradient(circle at 70% 22%,rgba(197,234,154,.58),transparent 9%),radial-gradient(circle at 13% 76%,rgba(52,149,126,.6),transparent 37%),linear-gradient(145deg,#162c31,#071411)",
          neon:"radial-gradient(circle at 77% 25%,rgba(255,68,207,.8),transparent 19%),radial-gradient(circle at 20% 75%,rgba(48,216,255,.72),transparent 25%),linear-gradient(145deg,#180b31,#071b2c 55%,#16081e)"
        };
        phone.style.backgroundImage = state.wallpaper === "custom" && state.wallpaperCustom ? `url('${state.wallpaperCustom}')` : backgrounds[state.wallpaper] || backgrounds.ink;
        phone.style.backgroundSize = state.wallpaper === "custom" ? "cover" : "180% 180%";
      }
      let startY = 0, startX = 0;
      phone.addEventListener("touchstart", e => { const t=e.touches[0]; startY=t.clientY; startX=t.clientX; }, {passive:true});
      phone.addEventListener("touchend", e => {
        const t=e.changedTouches[0], dy=t.clientY-startY, dx=t.clientX-startX;
        if (Math.abs(dy) < 42 || Math.abs(dy) < Math.abs(dx)) return;
        if (startY < 90 && dy > 55) { setOpen("shade", true); }
        else if (dy < -60 && startY > phone.clientHeight - 140) { setOpen("drawer", true); }
        else if (dy > 70 && shade.classList.contains("open")) setOpen("shade", false);
        else if (dy < -70 && drawer.classList.contains("open")) setOpen("drawer", false);
      }, {passive:true});
      $("gestureBar").addEventListener("click", () => setOpen("drawer", true));
      document.addEventListener("keydown", e => { if (e.key === "Escape") { closeModal(); setOpen(""); } if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="k") { e.preventDefault(); setOpen("drawer",true); $("appSearch").focus(); } });
      updateTime(); renderApps(); renderTiles(); renderNotifications(); applyWallpaper();
      setInterval(updateTime, 1000);
    })();
  </script>
</body>
